---
# =============================================================
# Playbook principal — configure et durcit toute la flotte
# Ordre : hardening d'abord, puis les services
# =============================================================

- name: Configurer et durcir le serveur web
  hosts: web
  become: true
  roles:
    - hardening
    - webserver

- name: Configurer et durcir le serveur FTP
  hosts: ftp
  become: true
  roles:
    - hardening
    - ftpserver